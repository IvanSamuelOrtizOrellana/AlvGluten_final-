services:
  app:
    build: .
    ports:
      - "8081:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=alvgluten
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: alvgluten_postgres
    restart: always
    environment:
      POSTGRES_DB: alvgluten
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: alvgluten_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@alvgluten.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data:
